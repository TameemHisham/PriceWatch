spring.application.name=pricewatch
spring.jpa.hibernate.ddl-auto=update
spring.profiles.include=secrets
#server.tomcat.accesslog.enabled=true
#server.tomcat.accesslog.directory=logs
#server.tomcat.accesslog.pattern=%t "%r" %s
#logging.level.org.springframework.web=DEBUG
logging.level.com.tameem.pricewatch=DEBUG
spring.jpa.open-in-view=false
pricewatch.scrape.interval=21600000
pricewatch.scrape.initial-delay=60000

# Marketplaces: a storefront plus the delivery country it prices for. Adding one
# is configuration, not code. proxy-host/port are optional but matter: retailers
# price and stock by the requesting IP's country, so with no proxy the observation
# reflects whatever country this host sits in.
pricewatch.scrape.marketplaces.AMAZON_UK.host=amazon.co.uk
pricewatch.scrape.marketplaces.AMAZON_UK.delivery-country=GB
pricewatch.scrape.marketplaces.AMAZON_UK.accept-language=en-GB,en;q=0.9
#pricewatch.scrape.marketplaces.AMAZON_UK.proxy-host=uk-proxy.example.net
#pricewatch.scrape.marketplaces.AMAZON_UK.proxy-port=8080

pricewatch.scrape.marketplaces.AMAZON_AE.host=amazon.ae
pricewatch.scrape.marketplaces.AMAZON_AE.delivery-country=AE
pricewatch.scrape.marketplaces.AMAZON_AE.accept-language=en-AE,en;q=0.9

